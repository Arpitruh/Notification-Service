name: Notification platform CI
on:
  pull_request:
  push:
    branches: [master, feat/notification-platform-foundation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: notification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      RUN_DB_TESTS: '1'
      DATABASE_URL: postgresql://postgres:test-password@localhost:5432/notification_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: git rev-parse HEAD && grep -n 'async function accept' src/api/controllers/notification.controller.ts
      - run: npx vitest run tests/integration/outbox-concurrency.test.ts
      - run: npx vitest run tests/integration/worker-failure.test.ts
      # Deliberately wipes only this job's disposable localhost Redis.
      - name: Rebuild queued jobs after disposable Redis data loss
        env:
          RUN_REDIS_LOSS_TESTS: '1'
        run: npx vitest run tests/integration/redis-loss-ci.test.ts
